<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>لوحة التحكم | كشمير هوم</title>
<link href="https://fonts.googleapis.com/css2?family=Almarai:wght@300;400;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css">
<style>
:root{--bg:#edf2f9;--card:#fff;--tx:#344050;--mut:#9da9bb;--pri:#2c7be5;--ok:#00d27a;--warn:#f5803e;--err:#e63757;--line:#e3ebf6;--sh:0 7px 14px rgba(65,69,88,.1),0 3px 6px rgba(0,0,0,.07)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:'Almarai',sans-serif;font-size:14px}
a{text-decoration:none;color:inherit}
#gateMsg{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;font-weight:800;color:var(--mut)}

/* الهيكل */
.layout{display:flex;min-height:100vh}
.sb{width:250px;background:#fff;box-shadow:var(--sh);padding:20px 16px;position:sticky;top:0;height:100vh;overflow:auto;flex-shrink:0;z-index:50;transition:transform .25s}
.logo{display:flex;align-items:center;gap:10px;font-size:22px;font-weight:800;color:#111;padding:6px 8px 22px}
.logo i{width:38px;height:38px;border-radius:12px;background:linear-gradient(135deg,#2c7be5,#27bcfd);color:#fff;display:flex;align-items:center;justify-content:center;font-size:17px}
.logo span b{color:var(--pri)}
.sec-t{font-size:12px;color:var(--mut);margin:14px 8px 8px;display:flex;align-items:center;gap:8px}
.sec-t:after{content:"";flex:1;height:1px;background:var(--line)}
.nv{display:flex;align-items:center;gap:12px;width:100%;padding:11px 12px;border:none;background:none;border-radius:6px;font-family:inherit;font-size:14.5px;font-weight:700;color:#5e6e82;cursor:pointer;text-align:right;margin-bottom:2px}
.nv i{width:20px;text-align:center;color:#a0aec0}
.nv:hover{background:#f5f8fc}
.nv.active{background:#eaf1ff;color:var(--pri)} .nv.active i{color:var(--pri)}
.nv .cnt{margin-inline-start:auto;background:#eaf1ff;color:var(--pri);border-radius:20px;font-size:11px;padding:2px 9px}
.main{flex:1;min-width:0;padding:18px 26px 40px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px}
.burger{display:none;background:#fff;border:none;width:42px;height:42px;border-radius:10px;box-shadow:var(--sh);cursor:pointer;font-size:16px}
.search{flex:1;max-width:420px;position:relative}
.search input{width:100%;background:#fff;border:1px solid var(--line);border-radius:30px;padding:11px 44px 11px 16px;font-family:inherit;font-size:14px;outline:none}
.search input:focus{border-color:var(--pri)}
.search i{position:absolute;right:16px;top:50%;transform:translateY(-50%);color:var(--mut)}
.top .sp{flex:1}
.ib{background:#fff;border:none;width:42px;height:42px;border-radius:50%;box-shadow:var(--sh);cursor:pointer;color:#5e6e82;font-size:15px}
.ib:hover{color:var(--pri)}
.me{display:flex;align-items:center;gap:10px;background:#fff;box-shadow:var(--sh);border-radius:30px;padding:5px 6px 5px 14px;font-weight:800;font-size:13px}
.me .av{width:34px;height:34px;border-radius:50%;background:var(--pri);color:#fff;display:flex;align-items:center;justify-content:center}

/* كروت */
.grid{display:grid;gap:20px}
.g4{grid-template-columns:repeat(4,1fr)} .g2{grid-template-columns:1fr 1fr} .g21{grid-template-columns:2fr 1fr}
.card{background:var(--card);border-radius:8px;box-shadow:var(--sh);overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:16px 20px;font-weight:800;font-size:15px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.card-b{padding:18px 20px}
.stat{padding:20px}
.stat .l{font-weight:700;color:#5e6e82;display:flex;align-items:center;justify-content:space-between}
.stat .l i{width:34px;height:34px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:15px}
.stat .v{font-size:32px;font-weight:300;margin-top:10px;color:#4d5969;font-family:'Almarai',sans-serif}
.i-b{background:#e5f0ff;color:var(--pri)} .i-g{background:#dcf8ec;color:#00a15c} .i-o{background:#ffeadb;color:var(--warn)} .i-p{background:#f3e5ff;color:#9a55e6}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;min-width:640px}
th{background:#f9fafd;color:#7c8aa0;font-weight:800;font-size:12px;text-align:right;padding:11px 16px;white-space:nowrap}
td{padding:12px 16px;border-top:1px solid var(--line);vertical-align:middle}
tr.click{cursor:pointer} tr.click:hover td{background:#f9fafd}
.code{font-family:monospace;font-weight:800;letter-spacing:1px;direction:ltr;display:inline-block}
.badge{display:inline-block;padding:3px 11px;border-radius:20px;font-size:11.5px;font-weight:800;white-space:nowrap}
.b0{background:#eef1f6;color:#7c8aa0}.b1{background:#e5f0ff;color:var(--pri)}.b2{background:#fff3d6;color:#b98900}.b3{background:#ffeadb;color:var(--warn)}.b4{background:#dcf8ec;color:#00a15c}
.btn{border:none;border-radius:6px;padding:7px 14px;font-family:inherit;font-size:12.5px;font-weight:800;cursor:pointer;background:#eaf1ff;color:var(--pri)}
.btn:hover{background:#d9e7ff}.btn.red{background:#fde8ec;color:var(--err)}.btn.red:hover{background:#fbd3db}.btn.solid{background:var(--pri);color:#fff}
.sel,.inp{border:1px solid var(--line);border-radius:6px;padding:8px 12px;font-family:inherit;font-size:13px;background:#fff;outline:none}
.ava{width:38px;height:38px;border-radius:50%;background:#e5f0ff;color:var(--pri);display:inline-flex;align-items:center;justify-content:center;font-weight:800;flex-shrink:0;overflow:hidden}
.ava img{width:100%;height:100%;object-fit:cover}
.usr{display:flex;align-items:center;gap:10px}
.usr small{display:block;color:var(--mut);font-size:11.5px}
.mut{color:var(--mut)} .stars{color:#f5b301;letter-spacing:1px;white-space:nowrap}
.empty{text-align:center;padding:40px 10px;color:var(--mut)}
.empty i{font-size:38px;display:block;margin-bottom:10px;color:#d6dde8}
/* شارت */
.bars{display:flex;align-items:flex-end;gap:12px;height:170px;padding-top:10px}
.bar{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:6px}
.bar div{width:100%;max-width:38px;background:linear-gradient(180deg,#5aa3f5,#2c7be5);border-radius:6px 6px 0 0;min-height:3px}
.bar span{font-size:11px;color:var(--mut)} .bar b{font-size:12px}
.list-i{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--line);align-items:flex-start}
.list-i:first-child{border-top:none}
.list-i p{margin:2px 0 0;color:#5e6e82;font-size:13px;line-height:1.7}
/* مودال */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.55);display:none;align-items:center;justify-content:center;z-index:200;padding:16px}
#modal.open{display:flex}
.mbox{background:#fff;border-radius:12px;width:100%;max-width:820px;max-height:92vh;display:flex;flex-direction:column;overflow:hidden}
.mh{display:flex;align-items:center;justify-content:space-between;padding:16px 22px;border-bottom:1px solid var(--line);font-weight:800;font-size:16px}
.mx{border:none;background:#f1f2f5;width:34px;height:34px;border-radius:50%;cursor:pointer}
.mb{padding:20px 22px;overflow:auto}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:14px;margin-bottom:18px}
.kv .k{font-size:11.5px;color:var(--mut);font-weight:800;margin-bottom:3px}.kv .vv{font-weight:700;line-height:1.7;word-break:break-word}
.sub-t{font-weight:800;margin:20px 0 10px;font-size:14px;display:flex;align-items:center;gap:8px}
.mini{border:1px solid var(--line);border-radius:8px;padding:11px 14px;margin-bottom:8px;font-size:13px;line-height:1.8}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1f2937;color:#fff;padding:11px 22px;border-radius:30px;font-weight:700;z-index:999;font-size:13.5px}
/* إحصائيات */
.pbar{height:7px;background:#eef1f6;border-radius:6px;overflow:hidden;min-width:90px;margin-top:6px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,#5aa3f5,#2c7be5);border-radius:6px}
.pbar.g i{background:linear-gradient(90deg,#34e39b,#00d27a)}
.rk{display:inline-flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;background:#eef1f6;color:#7c8aa0;font-weight:800;font-size:12px}
.rk.t1{background:#fff3d6;color:#b98900}
.kpi-s{font-size:19px;font-weight:800;margin-top:10px;color:#344050;line-height:1.5}
.note{background:#fff8e6;border:1px solid #ffe3a3;color:#8a6500;border-radius:8px;padding:12px 16px;font-size:13px;line-height:1.9;margin-bottom:20px}
.hint{color:var(--mut);font-size:12px;padding:10px 20px 14px}
/* صور البروفايل + الفاتورة */
.ava.zoomable{cursor:zoom-in;user-select:none;-webkit-user-select:none;touch-action:manipulation}
.ava.zoomable:hover{box-shadow:0 0 0 3px #cfe0ff}
#lb{position:fixed;inset:0;background:rgba(15,23,42,.82);display:none;align-items:center;justify-content:center;z-index:400;padding:20px;cursor:zoom-out}
#lb.open{display:flex}
#lb img{max-width:92vw;max-height:90vh;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.5);background:#fff}
#invModal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:14px}
#invModal.open{display:flex}
.inv-box{background:#fff;border-radius:12px;width:100%;max-width:860px;max-height:94vh;display:flex;flex-direction:column;overflow:hidden}
.inv-body{padding:12px;overflow:auto;background:#eef1f6;flex:1}
.inv-scale{margin:0 auto;overflow:hidden}
.inv-paper{width:794px;transform-origin:top right;background:#fff;box-shadow:0 4px 18px rgba(0,0,0,.12)}
.inv-foot{display:flex;gap:10px;flex-wrap:wrap;padding:12px 18px;border-top:1px solid var(--line)}
/* حذف الطلب */
#delModal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:350;padding:16px}
#delModal.open{display:flex}
.del-box{background:#fff;border-radius:14px;width:100%;max-width:430px;padding:26px 24px;text-align:center}
.del-ico{width:56px;height:56px;border-radius:16px;background:#fde8ec;color:var(--err);display:flex;align-items:center;justify-content:center;font-size:23px;margin:0 auto 12px}
.del-box h4{margin:0 0 8px;font-size:18px;font-weight:800}
.del-box p{margin:0 0 12px;color:#5e6e82;line-height:1.9;font-size:13px}
.del-box .code{font-size:16px;color:#111;background:#f1f2f5;padding:3px 10px;border-radius:6px}
.del-err{min-height:20px;margin:6px 0;color:var(--err);font-weight:700;font-size:12.5px}
.del-btns{display:flex;gap:10px;margin-top:4px}
.del-btns .btn{flex:1;padding:11px}
.btn:disabled{opacity:.45;cursor:not-allowed}
/* الإيرادات */
.kpi-n{font-size:23px;font-weight:800;margin-top:10px;color:#344050;line-height:1.35}
.kpi-sub{margin-top:6px;font-size:12px;line-height:1.7;color:var(--mut)}
.chg{font-weight:800;font-size:12px;display:inline-block}
.chg.up{color:#00a15c}.chg.dn{color:var(--err)}
.seg{display:inline-flex;background:#eef1f6;border-radius:8px;padding:3px}
.seg button{border:none;background:none;font-family:inherit;font-weight:800;font-size:12.5px;padding:6px 14px;border-radius:6px;cursor:pointer;color:#5e6e82}
.seg button.on{background:#fff;color:var(--pri);box-shadow:0 1px 4px rgba(0,0,0,.12)}
.lg{display:flex;gap:8px;flex-wrap:wrap}
.lgb{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:5px 12px;font-family:inherit;font-size:12px;font-weight:800;color:#5e6e82;cursor:pointer}
.lgb i{width:9px;height:9px;border-radius:50%;display:inline-block}
.lgb.off{opacity:.45;text-decoration:line-through}
.lc{position:relative}
.lc-tip{position:absolute;top:6px;display:none;background:#1f2937;color:#fff;border-radius:8px;padding:8px 12px;font-size:12px;line-height:1.9;pointer-events:none;white-space:nowrap;z-index:5}
.lc-tip i{display:inline-block;width:8px;height:8px;border-radius:50%;margin-inline-end:6px}
tfoot td{font-weight:800;background:#f3f7ff;border-top:2px solid var(--line)}
#repModal{position:fixed;inset:0;background:rgba(15,23,42,.6);display:none;align-items:center;justify-content:center;z-index:300;padding:14px}
#repModal.open{display:flex}
@media(max-width:1100px){.g4{grid-template-columns:1fr 1fr}.g21,.g2{grid-template-columns:1fr}}
@media(max-width:820px){
  .sb{position:fixed;right:0;top:0;transform:translateX(100%)} .sb.open{transform:none;box-shadow:0 0 0 100vmax rgba(0,0,0,.4)}
  .burger{display:block}.main{padding:14px}.me span{display:none}
}
@media(max-width:520px){.g4{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="gateMsg">جاري التحقق...</div>
<div class="layout">
  <aside class="sb" id="sb">
    <div class="logo"><i class="fa-solid fa-gem"></i><span>كشمير <b>هوم</b></span></div>
    <button class="nv active" data-view="dashboard"><i class="fa-solid fa-chart-pie"></i> لوحة التحكم</button>
    <div class="sec-t">الإدارة</div>
    <button class="nv" data-view="orders"><i class="fa-solid fa-box-open"></i> الطلبات <span class="cnt" id="cntOrders">0</span></button>
    <button class="nv" data-view="cancelled"><i class="fa-solid fa-ban"></i> الطلبات الملغية <span class="cnt" id="cntCancelled" style="background:#fde8ec;color:var(--err)">0</span></button>
    <button class="nv" data-view="comments"><i class="fa-solid fa-comments"></i> التعليقات <span class="cnt" id="cntComments">0</span></button>
    <button class="nv" data-view="accounts"><i class="fa-solid fa-users"></i> الحسابات <span class="cnt" id="cntUsers">0</span></button>
    <button class="nv" data-view="coupons"><i class="fa-solid fa-tag"></i> أكواد الخصم <span class="cnt" id="cntCoupons">0</span></button>
    <button class="nv" data-view="analytics"><i class="fa-solid fa-chart-line"></i> الإحصائيات</button>
    <button class="nv" data-view="revenue"><i class="fa-solid fa-sack-dollar"></i> الإيرادات</button>
    <div class="sec-t">أخرى</div>
    <a class="nv" href="accoun.html"><i class="fa-solid fa-user"></i> حسابي</a>
    <a class="nv" href="../index.html"><i class="fa-solid fa-store"></i> العودة للموقع</a>
    <button class="nv" id="adminLogout"><i class="fa-solid fa-right-from-bracket"></i> خروج من لوحة التحكم</button>
  </aside>
  <div class="main">
    <div class="top">
      <button class="burger" id="burger"><i class="fa-solid fa-bars"></i></button>
      <div class="search"><i class="fa-solid fa-magnifying-glass"></i><input id="q" placeholder="ابحث في القسم الحالي..."></div>
      <div class="sp"></div>
      <button class="ib" id="bulkBtn" title="مسح جماعي" style="color:var(--err)"><i class="fa-solid fa-broom"></i></button>
      <button class="ib" id="refresh" title="تحديث البيانات"><i class="fa-solid fa-rotate"></i></button>
      <div class="me"><span>المشرف</span><div class="av"><i class="fa-solid fa-user-shield"></i></div></div>
    </div>
    <div id="view"></div>
  </div>
</div>
<div id="modal"><div class="mbox"><div class="mh"><span id="mt"></span><button class="mx" id="mx">✕</button></div><div class="mb" id="mbody"></div></div></div>
<script type="module" src="../js/admin.js?v=8"></script>
</body>
</html>
